<script>
(function(){
  // Email-safe palette and fonts, written inline into every element.
  var C = {
    text: '#1c1d1f', dim: '#4f5259', faint: '#7a7c83', gold: '#8a5f22',
    green: '#1f7a4d', red: '#b2402f', border: '#ddd7c8', panel: '#faf8f3'
  };
  var SANS = "Arial, Helvetica, sans-serif";
  var SERIF = "Georgia, 'Times New Roman', serif";
  var MONO = "Consolas, 'Courier New', monospace";

  function esc(s){
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function isNum(n){ return typeof n === 'number' && isFinite(n); }
  function money(n, cur){
    if (!isNum(n)) return '—';
    return new Intl.NumberFormat('en-US', {
      style: 'currency', currency: cur || 'USD',
      minimumFractionDigits: 2, maximumFractionDigits: 2
    }).format(n);
  }
  function signedMoney(n, cur){ return (n >= 0 ? '+' : '-') + money(Math.abs(n), cur); }
  function pct(n){ return isNum(n) ? (n >= 0 ? '+' : '') + n.toFixed(2) + '%' : '—'; }
  function dirColor(n){ return n > 0 ? C.green : (n < 0 ? C.red : C.dim); }
  function arrow(n){ return n > 0 ? '▲ ' : (n < 0 ? '▼ ' : ''); }
  function safeUrl(u){ return /^https?:\/\//i.test(u || '') ? u : null; }

  function stamp(iso){
    var d = new Date(iso);
    if (!iso || isNaN(d.getTime())) return { en: '—', el: '—' };
    var cet = d.toLocaleTimeString('en-GB', {
      timeZone: 'Europe/Berlin', hour: '2-digit', minute: '2-digit', hour12: false, timeZoneName: 'short'
    });
    function fmt(loc){
      var date = d.toLocaleDateString(loc, { timeZone: 'UTC', day: 'numeric', month: 'short', year: 'numeric' });
      var utc = d.toLocaleTimeString('en-GB', { timeZone: 'UTC', hour: '2-digit', minute: '2-digit', hour12: false });
      return date + ', ' + utc + ' UTC (' + cet + ')';
    }
    return { en: fmt('en-GB'), el: fmt('el-GR') };
  }

  // ---------- Building blocks (inline-styled HTML) ----------
  function heading(en, el){
    return '<h2 style="margin:30px 0 12px;padding:0 0 6px;border-bottom:2px solid ' + C.gold + ';' +
      'font-family:' + SERIF + ';font-size:20px;line-height:1.3;font-weight:bold;color:' + C.text + ';">' +
      esc(en) + ' <span lang="el" style="font-weight:normal;color:' + C.dim + ';">/ ' + esc(el) + '</span></h2>';
  }
  function pEn(html, extra){
    return '<p style="margin:0;font-family:' + SANS + ';font-size:15px;line-height:1.55;color:' + C.text + ';' + (extra || '') + '">' + html + '</p>';
  }
  function pEl(html, extra){
    return '<p lang="el" style="margin:6px 0 0;font-family:' + SANS + ';font-size:15px;line-height:1.55;color:' + C.dim + ';' + (extra || '') + '">' + html + '</p>';
  }
  function small(html, extra){
    return '<div style="font-family:' + SANS + ';font-size:12.5px;line-height:1.5;color:' + C.faint + ';' + (extra || '') + '">' + html + '</div>';
  }
  function labelled(label, text){ return label ? '<strong>' + esc(label) + ':</strong> ' + esc(text) : esc(text); }

  // ---------- Sparkline as a PNG (images paste into email; SVG does not) ----------
  function chartDataUrl(pts){
    if (!pts || pts.length < 2) return null;
    var cv = document.createElement('canvas');
    if (!cv.getContext) return null;
    var W = 640, H = 160, pad = 12;
    cv.width = W; cv.height = H;
    var g = cv.getContext('2d');
    g.fillStyle = '#ffffff'; g.fillRect(0, 0, W, H);
    var min = Math.min.apply(null, pts), max = Math.max.apply(null, pts);
    var range = (max - min) || 1, step = (W - pad * 2) / (pts.length - 1);
    var xy = pts.map(function(v, i){ return [pad + i * step, H - pad - ((v - min) / range) * (H - pad * 2)]; });
    var up = pts[pts.length - 1] >= pts[0];
    var col = up ? C.green : C.red;
    function trace(){ xy.forEach(function(p, i){ if (i) g.lineTo(p[0], p[1]); else g.moveTo(p[0], p[1]); }); }
    var grad = g.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, up ? 'rgba(31,122,77,0.22)' : 'rgba(178,64,47,0.22)');
    grad.addColorStop(1, 'rgba(255,255,255,0)');
    g.beginPath(); trace();
    g.lineTo(xy[xy.length - 1][0], H); g.lineTo(xy[0][0], H); g.closePath();
    g.fillStyle = grad; g.fill();
    g.beginPath(); trace();
    g.strokeStyle = col; g.lineWidth = 3.5; g.lineJoin = 'round'; g.lineCap = 'round'; g.stroke();
    var last = xy[xy.length - 1];
    g.beginPath(); g.arc(last[0], last[1], 5.5, 0, Math.PI * 2); g.fillStyle = col; g.fill();
    try { return cv.toDataURL('image/png'); } catch (e) { return null; }
  }

  // ---------- Sections: each returns { html, text, copy } ----------
  function secHeader(d){
    var t = stamp(d.updated_at);
    var html =
      '<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;"><tr>' +
      '<td style="padding:0 0 12px;border-bottom:3px solid ' + C.gold + ';">' +
      '<div style="font-family:' + SERIF + ';font-size:28px;font-weight:bold;line-height:1.2;color:' + C.text + ';">Gold Digest</div>' +
      '<div style="font-family:' + SANS + ';font-size:13px;color:' + C.dim + ';margin-top:3px;">XAU/USD weekly briefing <span lang="el">/ Εβδομαδιαία ενημέρωση για τον χρυσό</span></div>' +
      small('Updated ' + esc(t.en) + ' <span lang="el">/ Ενημέρωση ' + esc(t.el) + '</span>', 'margin-top:6px;') +
      '</td></tr></table>';
    var text = 'GOLD DIGEST: XAU/USD weekly briefing / Εβδομαδιαία ενημέρωση για τον χρυσό\n' +
      'Updated ' + t.en + ' / Ενημέρωση ' + t.el;
    return { html: html, text: text };
  }

  function pickLevel(levels, re, spot, below){
    var m = levels.filter(function(l){ return re.test(l.level || '') && isNum(l.price); });
    if (!m.length) return null;
    if (isNum(spot)){
      var side = m.filter(function(l){ return below ? l.price <= spot : l.price >= spot; });
      if (side.length){
        side.sort(function(a, b){ return below ? b.price - a.price : a.price - b.price; });
        return side[0];
      }
    }
    return m[0];
  }

  function secPrice(d){
    var cur = d.currency || 'USD', unit = d.unit || 'oz';
    var levels = d.levels || [];
    var sup = pickLevel(levels, /support/i, d.spot_price, true);
    var res = pickLevel(levels, /resistance/i, d.spot_price, false);
    function delta(abs, p){
      if (!isNum(abs)) return '—';
      return '<span style="color:' + dirColor(abs) + ';">' + arrow(abs) + signedMoney(abs, cur) + (isNum(p) ? ' (' + pct(p) + ')' : '') + '</span>';
    }
    var rows = [
      ['Day change', 'Μεταβολή ημέρας', delta(d.day_change, d.day_change_pct)],
      ['Week change', 'Μεταβολή εβδομάδας', delta(d.week_change, d.week_change_pct)],
      ['Year to date', 'Από την αρχή του έτους', isNum(d.ytd_change_pct) ? '<span style="color:' + dirColor(d.ytd_change_pct) + ';">' + pct(d.ytd_change_pct) + '</span>' : '—'],
      ['Week high', 'Υψηλό εβδομάδας', money(d.week_high, cur)],
      ['Week low', 'Χαμηλό εβδομάδας', money(d.week_low, cur)],
      ['Nearest support', 'Κοντινότερη στήριξη', sup ? money(sup.price, cur) : '—'],
      ['Nearest resistance', 'Κοντινότερη αντίσταση', res ? money(res.price, cur) : '—']
    ];
    var html = heading('Price', 'Τιμή') +
      small('Spot price <span lang="el">/ Τιμή spot</span>') +
      '<div style="font-family:' + MONO + ';font-size:36px;font-weight:bold;line-height:1.2;color:' + C.text + ';margin-top:2px;">' +
      money(d.spot_price, cur) + ' <span style="font-family:' + SANS + ';font-size:15px;font-weight:normal;color:' + C.dim + ';">' + esc(cur) + ' / ' + esc(unit) + '</span></div>';
    var text = 'PRICE / ΤΙΜΗ\nSpot / Τιμή spot: ' + money(d.spot_price, cur) + ' ' + cur + '/' + unit;
    if (isNum(d.spot_price_eur)){
      html += '<div style="font-family:' + MONO + ';font-size:20px;font-weight:bold;line-height:1.3;color:' + C.text + ';margin-top:2px;">' +
        money(d.spot_price_eur, 'EUR') + ' <span style="font-family:' + SANS + ';font-size:14px;font-weight:normal;color:' + C.dim + ';">EUR / ' + esc(unit) + '</span></div>';
      text += '\nSpot in euros / Τιμή σε ευρώ: ' + money(d.spot_price_eur, 'EUR') + ' EUR/' + unit;
    }

    var pts = (d.sparkline || []).filter(isNum);
    var url = chartDataUrl(pts);
    var lab = d.sparkline_labels || {};
    if (url){
      html += '<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;margin-top:14px;width:100%;max-width:320px;"><tr><td colspan="2" style="padding:0;">' +
        '<img src="' + url + '" width="320" alt="Recent daily prices / Πρόσφατες ημερήσιες τιμές" style="display:block;width:100%;max-width:320px;height:auto;border:0;">' +
        '</td></tr><tr>' +
        '<td style="padding:3px 0 0;font-family:' + SANS + ';font-size:12px;color:' + C.faint + ';text-align:left;">' + esc(lab.start || '') + '</td>' +
        '<td style="padding:3px 0 0;font-family:' + SANS + ';font-size:12px;color:' + C.faint + ';text-align:right;">' + esc(lab.end || '') + '</td>' +
        '</tr></table>';
    }
    if (pts.length){
      var series = pts.map(function(v){ return money(v, cur).replace(/^[^0-9]+/, ''); }).join(' · ');
      html += small('Recent daily prices <span lang="el">/ Πρόσφατες ημερήσιες τιμές</span> (' + esc(cur) + '): ' + esc(series), 'margin-top:6px;');
      text += '\nRecent daily prices / Πρόσφατες ημερήσιες τιμές (' + cur + '): ' + series;
    }

    html += '<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;margin-top:16px;">';
    rows.forEach(function(r){
      html += '<tr>' +
        '<td style="padding:8px 12px 8px 0;border-bottom:1px solid ' + C.border + ';font-family:' + SANS + ';font-size:14px;color:' + C.text + ';vertical-align:top;">' +
          esc(r[0]) + ' <span lang="el" style="color:' + C.dim + ';">/ ' + esc(r[1]) + '</span></td>' +
        '<td style="padding:8px 0;border-bottom:1px solid ' + C.border + ';font-family:' + MONO + ';font-size:14px;font-weight:bold;color:' + C.text + ';text-align:right;white-space:nowrap;vertical-align:top;">' + r[2] + '</td>' +
        '</tr>';
      text += '\n' + r[0] + ' / ' + r[1] + ': ' + r[2].replace(/<[^>]+>/g, '');
    });
    html += '</table>';
    return { html: html, text: text, copy: true };
  }

  function secBullets(d){
    var items = (d.bullets || []).slice(0, 5).map(function(b){ return typeof b === 'string' ? { text: b } : (b || {}); });
    if (!items.length) return null;
    var html = heading('This Week in Gold', 'Η εβδομάδα στον χρυσό') + '<ul style="margin:0;padding:0 0 0 22px;">';
    var text = 'THIS WEEK IN GOLD / Η ΕΒΔΟΜΑΔΑ ΣΤΟΝ ΧΡΥΣΟ';
    items.forEach(function(b){
      html += '<li style="margin:0 0 14px;padding:0;font-family:' + SANS + ';font-size:15px;line-height:1.55;color:' + C.text + ';">' +
        pEn(labelled(b.category, b.text)) +
        (b.text_el ? pEl(labelled(b.category_el || b.category, b.text_el)) : '') +
        '</li>';
      text += '\n\n- ' + (b.category ? b.category + ': ' : '') + (b.text || '');
      if (b.text_el) text += '\n  ' + ((b.category_el || b.category) ? (b.category_el || b.category) + ': ' : '') + b.text_el;
    });
    html += '</ul>';
    return { html: html, text: text, copy: true };
  }

  var BIAS = {
    bullish: { en: 'Bullish', el: 'Ανοδική', col: C.green, bg: '#e3f1e9' },
    bearish: { en: 'Bearish', el: 'Πτωτική', col: C.red, bg: '#f6e3e0' },
    neutral: { en: 'Neutral', el: 'Ουδέτερη', col: C.gold, bg: '#f3ead9' }
  };
  function secOutlook(d){
    var o = d.outlook || {};
    if (!o.text && !o.text_el) return null;
    var b = BIAS[(o.bias || 'neutral').toLowerCase()] || BIAS.neutral;
    var html = heading('Desk Outlook', 'Προοπτικές') +
      '<div style="margin:0 0 10px;"><span style="display:inline-block;padding:3px 10px;border-radius:12px;background:' + b.bg + ';color:' + b.col + ';font-family:' + SANS + ';font-size:13px;font-weight:bold;">' +
      'Bias: ' + b.en + ' <span lang="el">/ Τάση: ' + b.el + '</span></span></div>' +
      (o.text ? pEn(esc(o.text)) : '') +
      (o.text_el ? pEl(esc(o.text_el), 'margin-top:10px;') : '');
    var text = 'DESK OUTLOOK / ΠΡΟΟΠΤΙΚΕΣ\nBias: ' + b.en + ' / Τάση: ' + b.el +
      (o.text ? '\n\n' + o.text : '') + (o.text_el ? '\n\n' + o.text_el : '');
    return { html: html, text: text, copy: true };
  }

  function levelEl(l){
    if (l.level_el) return l.level_el;
    return String(l.level || '').replace(/^support/i, 'Στήριξη').replace(/^resistance/i, 'Αντίσταση');
  }
  function secLevels(d){
    var levels = d.levels || [];
    if (!levels.length) return null;
    var cur = d.currency || 'USD';
    var r = d.levels_rationale || {};
    var html = heading('Levels to Watch', 'Επίπεδα προς παρακολούθηση');
    var text = 'LEVELS TO WATCH / ΕΠΙΠΕΔΑ ΠΡΟΣ ΠΑΡΑΚΟΛΟΥΘΗΣΗ';
    if (r.en || r.el){
      html += '<div style="margin:0 0 14px;">' + (r.en ? pEn(esc(r.en)) : '') + (r.el ? pEl(esc(r.el)) : '') + '</div>';
      text += (r.en ? '\n' + r.en : '') + (r.el ? '\n' + r.el : '');
    }
    var th = 'padding:6px 12px 6px 0;border-bottom:2px solid ' + C.border + ';font-family:' + SANS + ';font-size:12.5px;font-weight:bold;color:' + C.dim + ';text-align:left;vertical-align:bottom;';
    var td = 'padding:9px 12px 9px 0;border-bottom:1px solid ' + C.border + ';vertical-align:top;';
    html += '<table width="100%" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;">' +
      '<tr><th style="' + th + '">Level <span lang="el">/ Επίπεδο</span></th>' +
      '<th style="' + th + '">Price <span lang="el">/ Τιμή</span></th>' +
      '<th style="' + th + 'padding-right:0;">Note <span lang="el">/ Σχόλιο</span></th></tr>';
    levels.forEach(function(l){
      html += '<tr>' +
        '<td style="' + td + 'font-family:' + SANS + ';font-size:14px;color:' + C.text + ';white-space:nowrap;">' + esc(l.level) + '<br><span lang="el" style="color:' + C.dim + ';">' + esc(levelEl(l)) + '</span></td>' +
        '<td style="' + td + 'font-family:' + MONO + ';font-size:14px;font-weight:bold;color:' + C.text + ';white-space:nowrap;">' + money(l.price, cur) + '</td>' +
        '<td style="' + td + 'padding-right:0;font-family:' + SANS + ';font-size:14px;line-height:1.5;color:' + C.text + ';">' + esc(l.note || '') +
          (l.note_el ? '<br><span lang="el" style="display:inline-block;margin-top:4px;color:' + C.dim + ';">' + esc(l.note_el) + '</span>' : '') + '</td>' +
        '</tr>';
      text += '\n\n- ' + l.level + ' / ' + levelEl(l) + ': ' + money(l.price, cur) +
        (l.note ? '\n  ' + l.note : '') + (l.note_el ? '\n  ' + l.note_el : '');
    });
    html += '</table>';
    return { html: html, text: text, copy: true };
  }

  function secNotes(d){
    var n = d.price_notes || {};
    if (!n.en && !n.el) return null;
    var html = heading('Data Notes', 'Σημειώσεις δεδομένων') +
      (n.en ? small(esc(n.en)) : '') + (n.el ? small(esc(n.el), 'margin-top:6px;') : '').replace('<div style', '<div lang="el" style');
    var text = 'DATA NOTES / ΣΗΜΕΙΩΣΕΙΣ ΔΕΔΟΜΕΝΩΝ' + (n.en ? '\n' + n.en : '') + (n.el ? '\n' + n.el : '');
    return { html: html, text: text };
  }

  function secSources(d){
    var src = (d.sources || []).filter(function(s){ return s && safeUrl(s.url); });
    if (!src.length) return null;
    var html = heading('Sources', 'Πηγές') + '<ul style="margin:0;padding:0 0 0 22px;">';
    var text = 'SOURCES / ΠΗΓΕΣ';
    src.forEach(function(s){
      html += '<li style="margin:0 0 5px;font-family:' + SANS + ';font-size:13px;line-height:1.5;color:' + C.dim + ';">' +
        '<a href="' + esc(s.url) + '" style="color:' + C.gold + ';text-decoration:underline;">' + esc(s.name || s.url) + '</a></li>';
      text += '\n- ' + (s.name || s.url) + ': ' + s.url;
    });
    html += '</ul>';
    return { html: html, text: text, copy: true };
  }

  function secFooter(){
    var en = 'Gold Digest is for informational purposes only and is not investment advice.';
    var el = 'Το Gold Digest έχει αποκλειστικά ενημερωτικό χαρακτήρα και δεν αποτελεί επενδυτική συμβουλή.';
    var html = '<div style="margin-top:30px;padding-top:12px;border-top:1px solid ' + C.border + ';">' +
      small(esc(en)) + small(esc(el), 'margin-top:2px;').replace('<div style', '<div lang="el" style') + '</div>';
    return { html: html, text: en + '\n' + el };
  }

  // ---------- Clipboard ----------
  var statusEl = document.getElementById('copy-status');
  function setStatus(ok){
    statusEl.className = 'status' + (ok ? '' : ' fail');
    statusEl.textContent = ok
      ? 'Copied. Paste it into your email. / Αντιγράφηκε. Επικολλήστε το στο email σας.'
      : 'Copy failed. Select the text and press Ctrl+C or Cmd+C. / Η αντιγραφή απέτυχε. Επιλέξτε το κείμενο και πατήστε Ctrl+C ή Cmd+C.';
  }
  function wrapEmail(html){
    return '<div style="font-family:' + SANS + ';color:' + C.text + ';background:#ffffff;max-width:680px;">' + html + '</div>';
  }
  function copyViaSelection(html){
    var box = document.createElement('div');
    box.innerHTML = html;
    box.style.position = 'fixed'; box.style.left = '-10000px'; box.style.top = '0';
    document.body.appendChild(box);
    var sel = window.getSelection(), range = document.createRange();
    range.selectNodeContents(box);
    sel.removeAllRanges(); sel.addRange(range);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    sel.removeAllRanges();
    document.body.removeChild(box);
    return ok;
  }
  function copyRich(html, text){
    html = wrapEmail(html);
    if (navigator.clipboard && window.ClipboardItem && window.isSecureContext){
      var item = new ClipboardItem({
        'text/html': new Blob([html], { type: 'text/html' }),
        'text/plain': new Blob([text], { type: 'text/plain' })
      });
      navigator.clipboard.write([item]).then(function(){ setStatus(true); }, function(){ setStatus(copyViaSelection(html)); });
    } else {
      setStatus(copyViaSelection(html));
    }
  }

  // ---------- Render ----------
  function render(d){
    var sections = [secHeader(d), secPrice(d), secBullets(d), secOutlook(d), secLevels(d), secNotes(d), secSources(d), secFooter()]
      .filter(Boolean);
    var root = document.getElementById('digest');
    root.innerHTML = '';
    sections.forEach(function(s){
      var wrap = document.createElement('section');
      var body = document.createElement('div');
      body.innerHTML = s.html;
      wrap.appendChild(body);
      if (s.copy){
        var tools = document.createElement('div');
        tools.className = 'section-tools';
        var btn = document.createElement('button');
        btn.type = 'button'; btn.className = 'btn small';
        btn.textContent = 'Copy section / Αντιγραφή ενότητας';
        btn.addEventListener('click', function(){ copyRich(s.html, s.text); });
        tools.appendChild(btn);
        wrap.appendChild(tools);
      }
      root.appendChild(wrap);
    });
    var allHtml = sections.map(function(s){ return s.html; }).join('');
    var allText = sections.map(function(s){ return s.text; }).join('\n\n');
    document.getElementById('copy-all').addEventListener('click', function(){ copyRich(allHtml, allText); });
  }

  try {
    var data = JSON.parse(document.getElementById('digest-data').textContent);
    render(data);
  } catch (e) {
    document.getElementById('error-banner').style.display = 'block';
    console.error('Gold Digest: failed to parse or render data block', e);
  }
})();
</script>

</body>
</html>
